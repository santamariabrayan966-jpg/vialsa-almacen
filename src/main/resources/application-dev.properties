spring.config.import=optional:file:.env.local.properties
spring.application.name=DentIA-dev

spring.datasource.url=jdbc:mysql://${DENTIA_DB_HOST:localhost}:${DENTIA_DB_PORT:3306}/dentia?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DENTIA_DB_USERNAME:root}
spring.datasource.password=${DENTIA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.thymeleaf.cache=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from.name=DentIA

# El administrador inicial para entorno dev local
dentia.bootstrap-admin.enabled=${DENTIA_BOOTSTRAP_ADMIN_ENABLED:false}
dentia.bootstrap-admin.username=${DENTIA_BOOTSTRAP_ADMIN_USERNAME:admin}
dentia.bootstrap-admin.password=${DENTIA_BOOTSTRAP_ADMIN_PASSWORD:}
