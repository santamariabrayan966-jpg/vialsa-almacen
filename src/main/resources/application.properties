# Configuracion comun de DentIA
spring.application.name=DentIA
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Codificacion y recursos
spring.web.encoding.charset=UTF-8
spring.web.encoding.force=true
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Integraciones: nunca almacenar valores reales en el repositorio
miapi.token=${MIAPI_TOKEN:}
apisperu.token=${APISPERU_TOKEN:}
dentia.documento.provider=${DOCUMENTO_PROVIDER:miapi}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub


# DentIA funciona para un unico consultorio. La sede heredada queda solo como compatibilidad.
dentia.consultorio.modo-unico=true

# Inicializacion segura y opt-in del primer administrador.
dentia.bootstrap-admin.enabled=${DENTIA_BOOTSTRAP_ADMIN_ENABLED:false}
dentia.bootstrap-admin.username=${DENTIA_BOOTSTRAP_ADMIN_USERNAME:}
dentia.bootstrap-admin.password=${DENTIA_BOOTSTRAP_ADMIN_PASSWORD:}


# Granularidad tecnica para proponer inicios dentro de los horarios configurados.
dentia.agenda.intervalo-minutos=${DENTIA_AGENDA_INTERVALO_MINUTOS:10}

# Sesion persistente opcional de ambos portales (cookies separadas y firmadas).
dentia.security.remember-me-days=${DENTIA_REMEMBER_ME_DAYS:7}
dentia.security.remember-me-key=${DENTIA_REMEMBER_ME_KEY:}
dentia.security.password-reset-key=${DENTIA_PASSWORD_RESET_KEY:}
dentia.security.cookies-secure=${DENTIA_SECURITY_COOKIES_SECURE:false}
dentia.mail.from-address=${MAIL_FROM:${MAIL_USERNAME:}}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${DENTIA_SECURITY_COOKIES_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
