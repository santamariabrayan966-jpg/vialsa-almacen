spring.application.name=DentIA

spring.datasource.url=jdbc:mysql://${DENTIA_DB_HOST}:${DENTIA_DB_PORT:3306}/dentia?sslMode=${DENTIA_DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DENTIA_DB_USERNAME}
spring.datasource.password=${DENTIA_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
dentia.security.cookies-secure=true
dentia.security.password-reset-key=${DENTIA_PASSWORD_RESET_KEY}
dentia.security.remember-me-key=${DENTIA_REMEMBER_ME_KEY}
dentia.bootstrap-admin.enabled=false
dentia.clinica.initialize-schema=false
dentia.gestion.initialize-schema=false
dentia.documento.provider=${DOCUMENTO_PROVIDER:miapi}
miapi.token=${MIAPI_TOKEN:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjozNTAsImV4cCI6MTc2NjA4OTcyNH0.o6p7LzGOh208vlILr70MLsUIktN9G-t0neMzIBh-iqY}
apisperu.token=${APISPERU_TOKEN:eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJlbWFpbCI6InNhbnRhbWFyaWFicmF5YW45NjZAZ21haWwuY29tIiwianRpIjoiMTkyN2YyMDZkMzJmYjhmNSJ9.-RjjHorebfJo5JopQwcDpfDAf3-DDma9z1tY0KbjN3Y}
spring.sql.init.mode=never
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.thymeleaf.cache=false
spring.web.encoding.charset=UTF-8
spring.web.encoding.force=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=30000

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:}
mail.from.name=DentIA
