<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${titulo+' | DentIA'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dentia/admin.css}">
</head>
<body>
<div th:replace="~{fragments/interno/header :: headerInterno}"></div>
<main class="dentia-page container-fluid admin-page">
    <a class="text-success text-decoration-none" th:href="@{/interno/profesionales}"><i class="bi bi-arrow-left"></i> Profesionales</a>
    <h1 class="h2 fw-bold my-3" th:text="${titulo}"></h1>
    <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form method="post" enctype="multipart/form-data" class="card dentia-card border-0 p-3 p-lg-4" th:action="@{/interno/profesionales/guardar}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="idProfesional" th:value="${profesional.idProfesional}">
        <input type="hidden" name="foto" th:value="${profesional.foto}">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Nombres *</label><input class="form-control" name="nombres" th:value="${profesional.nombres}" required></div>
            <div class="col-md-6"><label class="form-label">Apellidos *</label><input class="form-control" name="apellidos" th:value="${profesional.apellidos}" required></div>
            <div class="col-md-4"><label class="form-label">Documento</label><input class="form-control" name="documento" th:value="${profesional.documento}"></div>
            <div class="col-md-4"><label class="form-label">Teléfono</label><input class="form-control" name="telefono" th:value="${profesional.telefono}"></div>
            <div class="col-md-4"><label class="form-label">Correo</label><input type="email" class="form-control" name="correo" th:value="${profesional.correo}"></div>
            <div class="col-md-6"><label class="form-label">Foto</label><input type="file" class="form-control" name="fotoFile" accept="image/*"></div>
            <div class="col-md-6"><label class="form-label">Cuenta interna opcional</label><select class="form-select" name="idUsuario"><option value="">Sin cuenta vinculada</option><option th:each="u:${usuariosInternos}" th:value="${u.idUsuario}" th:text="${u.nombres+' '+u.apellidos+' (@'+u.nombreUsuario+')'}" th:selected="${u.idUsuario==profesional.idUsuario}"></option></select></div>
            <div class="col-12"><label class="form-label">Especialidades</label><select class="form-select" name="especialidades" multiple size="5"><option th:each="e:${especialidades}" th:value="${e.idEspecialidad}" th:text="${e.nombre}" th:selected="${profesional.especialidades.![idEspecialidad].contains(e.idEspecialidad)}"></option></select></div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/interno/profesionales}">Cancelar</a><button class="btn btn-success">Guardar profesional</button></div>
    </form>
</main>
<div th:replace="~{fragments/interno/footer :: footerInterno}"></div>
</body>
</html>
