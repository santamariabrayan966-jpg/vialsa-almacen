<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Configuración del consultorio | ' + (config.nombreComercial ?: 'DentIA')">Configuración del consultorio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dentia/admin.css(v='20261109-2')}">
<style>
.consultorio-logo-group { display:flex; flex-direction:column; align-items:center; gap:.7rem; padding:1rem; background:#f3f9f7; border:1px solid #deebe7; border-radius:1rem; text-align:center; }
.consultorio-logo-frame { position:relative; width:130px; height:130px; border:4px solid #fff; border-radius:1.4rem; background:#fff; box-shadow:0 8px 24px #0f172a24; }
.consultorio-logo-preview { width:100%; height:100%; display:grid; place-items:center; overflow:hidden; border-radius:1rem; }
.consultorio-logo-preview img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; }
.consultorio-logo-placeholder { color:#819893; font-size:2.3rem; }
.consultorio-logo-camera,.consultorio-logo-remove { position:absolute; bottom:-6px; display:grid; place-items:center; width:36px; height:36px; border:2px solid #fff; border-radius:50%; cursor:pointer; box-shadow:0 4px 10px #143c3c30; }
.consultorio-logo-camera { right:-6px; background:#0284c7; color:#fff; }
.consultorio-logo-remove { left:-6px; background:#fff; color:#b33c48; }
.consultorio-actions { display:flex; justify-content:flex-end; gap:.6rem; margin-top:1.5rem; }
@media (max-width:991.98px) {
 .consultorio-actions { position:sticky; bottom:0; z-index:1020; margin:1.25rem -1rem -1rem; padding:.75rem 1rem; background:#fff; border-top:1px solid #dceae6; box-shadow:0 -6px 18px #163a3a0d; display:flex; justify-content:flex-end; gap:.6rem; }
 .consultorio-actions .btn { font-size:.9rem; padding:.6rem 1rem; border-radius:.75rem; }
}
</style></head>
<body class="panel-interno mobile-settings-module"><div th:replace="~{fragments/interno/header :: headerInterno}"></div>
<main class="dentia-page container-fluid admin-page">
    <div class="mb-3 mb-lg-4">
        <span class="text-success fw-semibold d-none d-lg-inline">Administración</span>
        <h1 class="h3 fw-bold mb-0 mb-lg-1">Configuración del consultorio</h1>
        <p class="text-secondary small mb-0 d-none d-sm-block">Una sola identidad para el panel, la página pública y todos los documentos.</p>
    </div>
    <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form method="post" enctype="multipart/form-data" th:object="${config}" class="card dentia-card border-0 p-3 p-lg-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="row g-4">
            <div class="col-lg-8">
                <label class="form-label fw-semibold" for="nombreComercial">Nombre de la empresa *</label>
                <input class="form-control form-control-lg" th:field="*{nombreComercial}" required maxlength="150" autocomplete="organization">
                
            </div>
            <div class="col-lg-4">
                <label class="form-label fw-semibold" for="ruc">RUC</label>
                <input class="form-control form-control-lg" th:field="*{ruc}" maxlength="20" inputmode="numeric" autocomplete="off">
            </div>
            <div class="col-12">
                <label class="form-label fw-semibold" for="slogan">Descripción del consultorio / Subtítulo</label>
                <input class="form-control form-control-lg" th:field="*{slogan}" maxlength="150" placeholder="Ej: CONSULTORIO, CLÍNICA ODONTOLÓGICA...">
                <small class="text-secondary">Esta descripción se muestra directamente debajo del nombre en la barra lateral del panel.</small>
            </div>
            <div class="col-lg-8">
                <label class="form-label fw-semibold" for="direccionPrincipal">Dirección</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text bg-white"><i class="bi bi-geo-alt text-success"></i></span>
                    <input class="form-control" th:field="*{direccionPrincipal}" maxlength="255" autocomplete="street-address">
                </div>
                
            </div>
            <div class="col-lg-4">
                <label class="form-label fw-semibold" for="whatsappPrincipal">Celular</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text bg-white"><i class="bi bi-phone text-success"></i></span>
                    <input class="form-control" th:field="*{whatsappPrincipal}" maxlength="30" inputmode="tel" autocomplete="tel">
                </div>
            </div>
            <div class="col-12">
                <span class="form-label fw-semibold">Logo de la empresa</span>
                <div class="consultorio-logo-group">
                    <div class="consultorio-logo-frame">
                        <div id="logoPreviewContainer" class="consultorio-logo-preview">
                            <img id="logoPreviewImg" th:if="${!#strings.isEmpty(config.obtenerLogoActivo())}"
                                 th:src="${config.obtenerLogoActivo()}" th:alt="${'Logo actual de ' + config.nombreComercial}">
                            <div id="logoPlaceholder" th:classappend="${!#strings.isEmpty(config.obtenerLogoActivo())} ? 'd-none' : ''" class="consultorio-logo-placeholder"><i class="bi bi-image"></i></div>
                        </div>
                        <label for="logo" class="consultorio-logo-camera" title="Cambiar logo" aria-label="Cambiar logo"><i class="bi bi-camera-fill"></i></label>
                        <button type="button" id="btnQuitarLogoConsultorio" class="consultorio-logo-remove" th:classappend="${#strings.isEmpty(config.obtenerLogoActivo())} ? ' d-none' : ''" title="Quitar logo" aria-label="Quitar logo"><i class="bi bi-trash3"></i></button>
                    </div>
                    <input id="logo" type="file" class="visually-hidden" name="logo" accept="image/png,image/jpeg,image/webp,image/svg+xml">
                    <small id="logoProportionBadge" class="text-secondary">Selecciona una imagen para el consultorio.</small>
                    <input type="hidden" name="eliminarLogo" id="eliminarLogoConsultorio" value="false">
                </div>            </div>
        </div>
        <div class="consultorio-actions"><a class="btn btn-outline-secondary d-lg-none" th:href="@{/interno/perfil}">Cancelar</a><button class="btn btn-success"><i class="bi bi-check2-circle me-1"></i>Guardar cambios</button></div>
    </form>
</main><div th:replace="~{fragments/interno/footer :: footerInterno}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
    const file = document.getElementById('logo');
    const remove = document.getElementById('btnQuitarLogoConsultorio');
    const flag = document.getElementById('eliminarLogoConsultorio');
    const container = document.getElementById('logoPreviewContainer');
    const placeholder = document.getElementById('logoPlaceholder');
    const badge = document.getElementById('logoProportionBadge');

    if (!file || !remove || !flag) return;

    file.addEventListener('change', () => {
        if (file.files && file.files[0]) {
            const f = file.files[0];
            if (!f.type.startsWith('image/')) {
                alert('Por favor selecciona un archivo de imagen válido (PNG, JPG, WEBP o SVG).');
                file.value = '';
                return;
            }
            flag.value = 'false';
            remove.classList.remove('d-none');

            // Actualización visual inmediata de la imagen
            const url = URL.createObjectURL(f);
            let img = document.getElementById('logoPreviewImg');
            if (!img) {
                img = document.createElement('img');
                img.id = 'logoPreviewImg';
                img.alt = 'Vista previa del logo';
                if (container) container.appendChild(img);
            }
            img.src = url;
            img.classList.remove('d-none');
            if (placeholder) placeholder.classList.add('d-none');

            if (badge) {
                badge.textContent = 'Nueva imagen seleccionada. Guarda los cambios para aplicarla.';
            }
        }
    });

    remove.addEventListener('click', () => {
        file.value = '';
        flag.value = 'true';
        remove.classList.add('d-none');
        const img = document.getElementById('logoPreviewImg');
        if (img) img.classList.add('d-none');
        if (placeholder) placeholder.classList.remove('d-none');
        if (badge) {
            badge.textContent = 'El logo se eliminará al guardar.';
        }
    });
})();
</script></body></html>
