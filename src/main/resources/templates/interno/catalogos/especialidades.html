<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Especialidades Clínicas | DentIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dentia/admin.css(v='20261109-2')}">
    <style>
        .specialty-card {
            border: 1px solid #e2e8f0;
            border-radius: 0.85rem;
            background: #ffffff;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }
        .specialty-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -4px rgba(15, 118, 110, 0.12);
            border-color: #cbd5e1;
        }
        .specialty-icon-circle {
            width: 34px;
            height: 34px;
            border-radius: 0.6rem;
            background: #f0fdfa;
            color: #0d9488;
            border: 1px solid #ccfbf1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .specialty-title {
            font-size: 0.95rem;
            line-height: 1.25;
        }
        .specialty-desc {
            font-size: 0.815rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.3em;
        }
        .specialty-count {
            font-size: 0.785rem;
        }
        .admin-actions .btn {
            font-size: 0.775rem;
            padding: 0.22rem 0.55rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/interno/header :: headerInterno}"></div>

<main class="dentia-page container-fluid admin-page py-4">
    <!-- Encabezado de página -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <span class="text-success fw-semibold">Catálogos Médicos</span>
            <h1 class="h2 fw-bold mb-1">Especialidades Odontológicas</h1>
            <p class="text-secondary mb-0">Áreas clínicas y ramas de atención asignables a los profesionales del consultorio.</p>
        </div>

        <button class="btn btn-success shadow-sm" id="btnNuevaEspecialidad" data-bs-toggle="modal" data-bs-target="#modalEspecialidad">
            <i class="bi bi-plus-circle-fill me-2"></i>Nueva especialidad
        </button>
    </div>

    <!-- Mensajes de feedback -->
    <div class="alert alert-success alert-dismissible fade show rounded-3" th:if="${ok}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${ok}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show rounded-3" th:if="${error}" role="alert">
        <i class="bi bi-exclamation-octagon-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <!-- Buscador rápido en vivo -->
    <div class="mb-4">
        <div class="input-group shadow-sm" style="max-width: 440px;">
            <span class="input-group-text bg-white border-end-0 py-2"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0 ps-0 py-2" id="inputBuscarEspecialidad" placeholder="Filtrar especialidad por nombre o descripción...">
        </div>
    </div>

    <!-- Cuadrícula compacta de tarjetas de Especialidades -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-4 g-3" id="gridEspecialidades">
        <div class="col item-especialidad" th:each="e : ${especialidades}" th:data-nombre="${e.nombre.toLowerCase()}" th:data-descripcion="${#strings.isEmpty(e.descripcion) ? '' : e.descripcion.toLowerCase()}">
            <article class="specialty-card p-3">
                <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
                    <div class="d-flex align-items-center gap-2 text-truncate">
                        <div class="specialty-icon-circle flex-shrink-0">
                            <i class="bi bi-award-fill"></i>
                        </div>
                        <h3 class="specialty-title fw-bold text-dark mb-0 text-truncate" th:title="${e.nombre}" th:text="${e.nombre}"></h3>
                    </div>
                    <span class="badge rounded-pill flex-shrink-0" 
                          th:classappend="${e.activo} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-secondary-subtle text-secondary border border-secondary-subtle'" 
                          th:text="${e.activo} ? 'Activa' : 'Inactiva'">
                    </span>
                </div>

                <p class="specialty-desc text-secondary mb-3 flex-grow-1" th:text="${#strings.isEmpty(e.descripcion) ? 'Sin descripción registrada para esta especialidad.' : e.descripcion}"></p>

                <!-- Conteo de especialistas asignados y acciones -->
                <div class="d-flex align-items-center justify-content-between pt-2 border-top mt-auto">
                    <span class="specialty-count text-muted">
                        <i class="bi bi-person-badge text-teal me-1" style="color: #0d9488;"></i>
                        <strong class="text-dark" th:text="${conteoDoctores.get(e.idEspecialidad) ?: 0}"></strong> esp.
                    </span>

                    <div class="admin-actions d-flex gap-1">
                        <button class="btn btn-outline-primary btn-editar-especialidad"
                                data-bs-toggle="modal" data-bs-target="#modalEspecialidad"
                                th:data-id="${e.idEspecialidad}"
                                th:data-nombre="${e.nombre}"
                                th:data-descripcion="${e.descripcion}">
                            <i class="bi bi-pencil-square"></i> Editar
                        </button>

                        <form method="post" th:action="@{'/interno/especialidades/' + ${e.idEspecialidad} + '/estado'}" class="d-inline mb-0">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="activo" th:value="${!e.activo}">
                            <button class="btn" 
                                    th:classappend="${e.activo} ? 'btn-outline-secondary' : 'btn-outline-success'" 
                                    th:text="${e.activo} ? 'Desactivar' : 'Activar'">
                            </button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>

<!-- MODAL DE EDICIÓN / CREACIÓN DE ESPECIALIDAD -->
<div class="modal fade" id="modalEspecialidad" tabindex="-1" aria-labelledby="modalEspTitulo" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
            <form method="post" th:action="@{/interno/especialidades}" id="formEspecialidad" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="idEspecialidad" id="modalEspId">

                <div class="modal-header bg-light border-bottom py-3 px-4">
                    <div>
                        <h5 class="modal-title fw-bold text-dark h5 mb-0" id="modalEspTitulo">Nueva especialidad médica</h5>
                        <small class="text-secondary">Parámetros del catálogo clínico.</small>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label for="modalEspNombre" class="form-label">Nombre de la especialidad <span class="text-danger">*</span></label>
                        <input class="form-control" name="nombre" id="modalEspNombre" required maxlength="120" placeholder="Ej: Ortodoncia & Ortopedia Maxilar" style="text-transform: uppercase;">
                        <div class="invalid-feedback">Ingresa el nombre de la especialidad (mínimo 3 caracteres).</div>
                    </div>

                    <div class="mb-3">
                        <label for="modalEspDescripcion" class="form-label">Descripción clínica</label>
                        <textarea class="form-control" name="descripcion" id="modalEspDescripcion" rows="4" maxlength="500" placeholder="Detalla el alcance del tratamiento y procedimientos habituales..."></textarea>
                        <small class="text-secondary">Máximo 500 caracteres.</small>
                    </div>
                </div>

                <div class="modal-footer bg-light border-top py-3 px-4">
                    <button type="submit" class="btn btn-success rounded-3 px-4 ms-auto">
                        <i class="bi bi-check-circle-fill me-1"></i> Guardar especialidad
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/interno/footer :: footerInterno}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const modalEl = document.getElementById('modalEspecialidad');
    const modalEsp = modalEl ? bootstrap.Modal.getOrCreateInstance(modalEl) : null;
    const formEsp = document.getElementById('formEspecialidad');
    const modalTitulo = document.getElementById('modalEspTitulo');
    const inputId = document.getElementById('modalEspId');
    const inputNombre = document.getElementById('modalEspNombre');
    const inputDesc = document.getElementById('modalEspDescripcion');

    // Botón Nueva
    const btnNueva = document.getElementById('btnNuevaEspecialidad');
    if (btnNueva) {
        btnNueva.addEventListener('click', () => {
            limpiarValidacion();
            formEsp.reset();
            inputId.value = '';
            modalTitulo.textContent = 'Nueva especialidad médica';
        });
    }

    // Botones Editar
    document.querySelectorAll('.btn-editar-especialidad').forEach(btn => {
        btn.addEventListener('click', function () {
            limpiarValidacion();
            formEsp.reset();
            inputId.value = this.dataset.id;
            inputNombre.value = this.dataset.nombre || '';
            inputDesc.value = this.dataset.descripcion || '';
            modalTitulo.textContent = `Editar especialidad: ${this.dataset.nombre}`;
        });
    });

    // Filtro en vivo
    const inputBuscar = document.getElementById('inputBuscarEspecialidad');
    if (inputBuscar) {
        inputBuscar.addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();
            document.querySelectorAll('.item-especialidad').forEach(item => {
                const nombre = item.dataset.nombre || '';
                const desc = item.dataset.descripcion || '';
                if (nombre.includes(query) || desc.includes(query)) {
                    item.classList.remove('d-none');
                } else {
                    item.classList.add('d-none');
                }
            });
        });
    }

    // Validación
    function limpiarValidacion() {
        formEsp.querySelectorAll('.is-invalid, .is-valid').forEach(el => el.classList.remove('is-invalid', 'is-valid'));
    }

    if (inputNombre) {
        inputNombre.addEventListener('input', () => {
            if (inputNombre.value.trim().length < 3) {
                inputNombre.classList.add('is-invalid');
                inputNombre.classList.remove('is-valid');
            } else {
                inputNombre.classList.remove('is-invalid');
                inputNombre.classList.add('is-valid');
            }
        });
    }

    if (formEsp) {
        formEsp.addEventListener('submit', function (e) {
            if (!inputNombre || inputNombre.value.trim().length < 3) {
                e.preventDefault();
                inputNombre.classList.add('is-invalid');
                inputNombre.focus();
            }
        });
    }
});
</script>

</body>
</html>
