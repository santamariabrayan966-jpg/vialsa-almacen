<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="perfilContenido">

    <!-- FOTO DEL CLIENTE -->
    <div class="text-center mb-3">

        <!-- FOTO GOOGLE -->
        <img th:if="${c.foto != null and !#strings.isEmpty(c.foto) and #strings.startsWith(c.foto,'http')}"
             th:src="${c.foto}"
             class="rounded-circle shadow-sm"
             style="width:120px; height:120px; object-fit:cover;"
             alt="Foto cliente">

        <!-- FOTO SUBIDA -->
        <img th:if="${c.foto != null and !#strings.isEmpty(c.foto) and !#strings.startsWith(c.foto,'http')}"
             th:src="@{|/uploads/clientes/${c.foto}|}"
             class="rounded-circle shadow-sm"
             style="width:120px; height:120px; object-fit:cover;"
             alt="Foto cliente">

        <!-- SIN FOTO -->
        <div th:if="${c.foto == null or #strings.isEmpty(c.foto)}"
             class="rounded-circle border bg-light shadow-sm mx-auto d-flex align-items-center justify-content-center"
             style="width:120px;height:120px;">
            <i class="bi bi-person-circle text-secondary" style="font-size:4rem;"></i>
        </div>

    </div>

    <!-- NOMBRE -->
    <h5 class="text-center fw-bold mb-0"
        th:text="${c.nombres + ' ' + c.apellidos}">
    </h5>

    <!-- ESTADOS -->
    <div class="text-center mt-2">
        <span class="badge bg-success" th:if="${c.activo}">Activo</span>
        <span class="badge bg-secondary" th:if="${!c.activo}">Inactivo</span>

        <span class="badge bg-warning text-dark" th:if="${c.vip}">
            <i class="bi bi-star-fill"></i> VIP
        </span>

        <span class="badge bg-danger" th:if="${c.moroso}">
            <i class="bi bi-exclamation-octagon-fill"></i> Moroso
        </span>
    </div>

    <hr>

    <!-- DATOS COMPLETOS -->
    <div class="px-2">

        <p><strong>DNI:</strong> <span th:text="${c.nro_documento}"></span></p>

        <p><strong>Correo:</strong>
            <a th:href="'mailto:' + ${c.correo}"
               th:text="${c.correo}"></a>
        </p>

        <p><strong>Teléfono:</strong>
            <a th:href="'tel:' + ${c.telefono}"
               th:text="${c.telefono}"></a>
        </p>

        <p><strong>Dirección:</strong>
            <span th:text="${c.direccion}"></span>
        </p>

        <p><strong>Tipo Documento:</strong>
            <span>DNI</span>
        </p>

        <p><strong>Registrado por:</strong>
            <span>Administrador</span>
        </p>

        <p>
            <strong>Fecha de registro:</strong>
            <span>No registrado</span>
        </p>

    </div>

</div>

</body>
</html>
