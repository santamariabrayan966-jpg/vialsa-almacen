<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${titulo}">Proveedor | DentIA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Tema DentIA (CLARO) -->
    <link th:href="@{/css/shared/theme.css}" rel="stylesheet">

    <!-- Tema exclusivo proveedores -->
    <link th:href="@{/css/interno/proveedores.css}" rel="stylesheet">

</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- Encabezado interno -->
<div th:replace="~{fragments/interno/header :: headerInterno}"></div>

<main class="proveedores-page container mt-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <div class="card shadow-sm border-0 card-proveedor-form">
                <div class="card-header d-flex justify-content-between align-items-center card-header-dentia">
                    <h5 class="mb-0" th:text="${titulo}">Proveedor</h5>
                    <a th:href="@{/interno/proveedores}" class="btn btn-sm btn-dentia-outline">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>
                <div class="card-body">

                    <form th:action="@{/interno/proveedores/guardar}" th:object="${proveedor}" method="post" id="form-proveedor" novalidate>
                        <div id="form-error-general" class="proveedores-alert proveedores-alert-error d-none" role="alert"></div>
                        <input type="hidden" th:field="*{idProveedor}"/>

                        <!-- Documento + botón API -->
                        <div class="mb-3">
                            <label class="form-label">N° Documento (RUC / DNI)</label>
                            <div class="input-group">
                                <input type="text" th:field="*{nroDocumento}"
                                       class="form-control"
                                       id="prov-nroDocumento"
                                       placeholder="DNI (8) o RUC (11)" maxlength="11" inputmode="numeric" required>
                                <button class="btn btn-outline-secondary"
                                        type="button" id="btn-buscar-doc">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block" id="error-nroDocumento"></div>
                            <div class="form-text text-muted">
                                Usa la API para completar razón social / dirección.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre / Razón social</label>
                            <input type="text" th:field="*{nombreProveedor}" class="form-control"
                                   id="prov-nombreProveedor"
                                   placeholder="Ej: Vidrios S.A.C." required minlength="3" maxlength="120">
                            <div class="invalid-feedback" id="error-nombreProveedor"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" th:field="*{telefono}" class="form-control" id="prov-telefono"
                                   placeholder="Ej: 987654321" maxlength="15" inputmode="numeric">
                            <div class="invalid-feedback" id="error-telefono"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" th:field="*{correo}" class="form-control" id="prov-correo"
                                   placeholder="Ej: contacto@empresa.com" maxlength="120">
                            <div class="invalid-feedback" id="error-correo"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" th:field="*{direccion}" class="form-control"
                                   id="prov-direccion"
                                   placeholder="Ej: Jr. Los Vidrios 123 - Lima" minlength="5" maxlength="180">
                            <div class="invalid-feedback" id="error-direccion"></div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <a th:href="@{/interno/proveedores}" class="btn btn-outline-secondary me-2">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-dentia-primary" id="btn-guardar-proveedor">
                                <span class="guardar-normal"><i class="bi bi-save"></i> Guardar</span>
                                <span class="guardar-cargando d-none"><span class="spinner-border spinner-border-sm"></span> Guardando…</span>
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<!-- Footer interno -->
<div th:replace="~{fragments/interno/footer :: footerInterno}"></div>

<!-- JS de terceros -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- JS propio -->
<script th:src="@{/js/shared/app.js}"></script>
<script th:src="@{/js/interno/proveedores.js}"></script>

</body>
</html>
