<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuotas de venta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/interno/panel-responsive.css}">
    <link rel="stylesheet" th:href="@{/css/interno/ventas.css}">

    <style>
        body { background:#f4f6f9; }
        .cuota-card {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 8px 22px rgba(15,23,42,.08);
        }
        .summary-box {
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            border-radius: 18px;
            padding: 18px;
        }
    </style>
</head>

<body class="panel-interno ventas-module ventas-cuotas-page">

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">
                <i class="bi bi-credit-card-2-front text-success me-1"></i>
                Gestión de cuotas
            </h4>
            <small class="text-muted">
                Venta #<span th:text="${idVenta}">0</span>
            </small>
        </div>
    </div>

    <div class="row g-3">

        <div class="col-12">
            <div class="card cuota-card">
                <div class="card-body">

                    <h6 class="fw-bold mb-3">
                        <i class="bi bi-list-check me-1"></i>
                        Cronograma de pagos
                    </h6>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle w-100 tabla-cuotas">
                            <thead class="table-light">
                            <tr>
                                <th>Cuota</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Método</th>
                                <th class="text-center">Acción</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="c : ${cuotas}">

                                <td class="fw-bold">
                                    Cuota <span th:text="${c.nroCuota}">1</span>
                                </td>

                                <td class="fw-semibold"
                                    th:text="'S/ ' + ${#numbers.formatDecimal(c.montoCuota,1,2)}">
                                    S/ 0.00
                                </td>

                                <td>
                                    <span class="badge bg-warning text-dark" th:if="${c.estado == 'PENDIENTE'}">Pendiente</span>
                                    <span class="badge bg-info text-dark" th:if="${c.estado == 'PARCIAL'}">Parcial</span>
                                    <span class="badge bg-success" th:if="${c.estado == 'PAGADA'}">Pagada</span>
                                </td>

                                <td style="min-width: 260px;">

    <span class="badge bg-light text-dark border px-3 py-2"
          th:if="${c.estado == 'PAGADA'}"
          th:text="${c.metodoPago != null ? c.metodoPago : 'Registrado'}">
        YAPE
    </span>

                                    <select class="form-select form-select-sm"
                                            name="metodoPago"
                                            th:form="'formPagoCuota_' + ${c.idCuotaVenta}"
                                            th:if="${c.estado != 'PAGADA'}"
                                            required>
                                        <option value="">Método</option>
                                        <option value="EFECTIVO">Efectivo</option>
                                        <option value="YAPE">Yape</option>
                                        <option value="PLIN">Plin</option>
                                        <option value="TRANSFERENCIA">Transferencia</option>
                                        <option value="TARJETA">Tarjeta</option>
                                    </select>

                                </td>

                                <td class="text-center">

                                    <form method="post"
                                          th:id="'formPagoCuota_' + ${c.idCuotaVenta}"
                                          th:action="@{/interno/ventas/cuotas/pagar}">

                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="idCuotaVenta" th:value="${c.idCuotaVenta}">
                                        <input type="hidden" name="montoPago" th:value="${c.saldoPendiente}">

                                        <button class="btn btn-success btn-sm rounded-pill px-3"
                                                th:if="${c.estado != 'PAGADA'}">
                                            <i class="bi bi-check-circle me-1"></i>
                                            Pagar
                                        </button>

                                        <span class="badge bg-success" th:if="${c.estado == 'PAGADA'}">
                Cancelada
            </span>

                                    </form>

                                </td>

                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="summary-box mt-3">
                <h6 class="fw-bold mb-3">
                    <i class="bi bi-bar-chart-line me-1"></i>
                    Resumen financiero
                </h6>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Total crédito</span>
                    <strong th:text="'S/ ' + ${#numbers.formatDecimal(#aggregates.sum(cuotas.![montoCuota]),1,2)}">S/ 0.00</strong>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Pagado</span>
                    <strong class="text-success" th:text="'S/ ' + ${#numbers.formatDecimal(#aggregates.sum(cuotas.![montoPagado]),1,2)}">S/ 0.00</strong>
                </div>

                <div class="d-flex justify-content-between">
                    <span class="text-muted">Pendiente</span>
                    <strong class="text-danger" th:text="'S/ ' + ${#numbers.formatDecimal(#aggregates.sum(cuotas.![saldoPendiente]),1,2)}">S/ 0.00</strong>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/interno/navbar.js}"></script>
<script th:if="${param.pagoRegistrado}">
    if (window.parent) {
        window.parent.location.reload();
    }
</script>
</body>
</html>
