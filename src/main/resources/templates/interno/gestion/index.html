<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}">
    <title>Gestión | DentIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dentia/gestion.css}">
</head>
<body>
<div th:replace="~{fragments/interno/header :: headerInterno}"></div>
<main class="dentia-page gestion-page" id="gestion" th:data-modulo="${moduloGestion}">
    <header class="gestion-heading"><div><p class="gestion-eyebrow">GESTIÓN DEL CONSULTORIO</p><h1 id="titulo">Gestión</h1><p id="subtitulo" class="text-secondary mb-0"></p></div><button class="btn btn-primary gestion-create" id="crear" type="button" disabled><i class="bi bi-plus-lg"></i> <span>Nuevo registro</span></button></header>
    <nav class="gestion-tabs" aria-label="Secciones de gestión">
        <a th:if="${permisosUsuario['pagos']==true}" th:href="@{/interno/gestion/pagos}" data-seccion="pagos"><i class="bi bi-credit-card"></i>Pagos y Cobros</a>
        <a th:if="${permisosUsuario['reportes']==true}" th:href="@{/interno/reportes}" data-seccion="reportes"><i class="bi bi-bar-chart"></i>Reportes Clínicos</a>
    </nav>
    <div id="aviso" role="status" aria-live="polite" hidden></div>
    <section id="indicadores" class="gestion-metrics" aria-label="Resumen de resultados"></section>
    <section class="gestion-surface gestion-filter">
        <form id="filtros"><div class="gestion-filter-grid">
            <label>Buscar paciente<input name="q" type="search" class="form-control" placeholder="Nombre o DNI" maxlength="100"></label>
            <label>Paciente<select name="paciente" class="form-select"><option value="">Todos los pacientes</option></select></label>
            <label id="estado-filtro">Estado<select name="estado" class="form-select"></select></label>
            <label>Desde<input name="desde" type="date" class="form-control"></label>
            <label>Hasta<input name="hasta" type="date" class="form-control"></label>
            <div class="gestion-filter-actions"><button class="btn btn-primary" type="submit">Filtrar</button><button class="btn btn-light" type="reset" title="Limpiar filtros" aria-label="Limpiar filtros"><i class="bi bi-arrow-counterclockwise"></i></button></div>
        </div><p class="small text-secondary mb-0 mt-2" id="filtro-ayuda">Los filtros se aplican a los registros y sus indicadores.</p></form>
    </section>
    <section class="gestion-surface gestion-results" aria-label="Registros">
        <div class="gestion-results-head"><div><h2 id="lista-titulo">Registros</h2><span id="conteo" class="text-secondary small"></span></div><button id="actualizar" class="btn btn-light btn-sm" type="button"><i class="bi bi-arrow-clockwise"></i> Actualizar</button></div>
        <div id="contenido" aria-live="polite" aria-busy="true"><div class="gestion-empty">Cargando información…</div></div>
        <footer class="gestion-pagination" id="paginacion"><button class="btn btn-outline-secondary btn-sm" id="anterior" type="button">Anterior</button><span id="pagina" class="small"></span><button class="btn btn-outline-secondary btn-sm" id="siguiente" type="button">Siguiente</button></footer>
    </section>
    <p class="gestion-footnote"><i class="bi bi-shield-lock"></i> Información interna · Acceso según permisos · Moneda: soles (PEN)</p>
</main>
<dialog id="editor" class="gestion-dialog" aria-labelledby="editor-titulo"><div class="gestion-dialog-head"><h2 id="editor-titulo"></h2><button class="btn-close" type="button" data-close aria-label="Cerrar"></button></div><form id="registro-form"><div class="gestion-dialog-body" id="editor-campos"></div><div class="gestion-form-error" role="alert" id="form-error" hidden></div><footer class="gestion-dialog-footer"><button class="btn btn-light" type="button" data-close>Cancelar</button><button class="btn btn-primary" id="guardar" type="submit">Guardar</button></footer></form></dialog>
<dialog id="detalle" class="gestion-dialog gestion-detail" aria-labelledby="detalle-titulo"><div class="gestion-dialog-head"><h2 id="detalle-titulo">Detalle</h2><button class="btn-close" type="button" data-close aria-label="Cerrar"></button></div><div class="gestion-dialog-body" id="detalle-contenido"></div><footer class="gestion-dialog-footer" id="detalle-acciones"></footer></dialog>
<div th:replace="~{fragments/interno/footer :: footerInterno}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/dentia/gestion.js}" defer></script>
</body></html>
