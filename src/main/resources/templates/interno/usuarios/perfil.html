<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil de usuario | DentIA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/dentia/admin.css(v='20261109-2')}"></head><body><div th:replace="~{fragments/interno/header :: headerInterno}"></div><main class="dentia-page container-fluid admin-page"><a th:href="@{/interno/usuarios}" class="text-success text-decoration-none"><i class="bi bi-arrow-left"></i> Usuarios</a><div class="alert alert-success mt-3" th:if="${ok}" th:text="${ok}"></div><div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div><div class="row g-4 mt-1"><div class="col-lg-7"><section class="card dentia-card border-0 p-4"><div class="d-flex justify-content-between gap-3"><div><h1 class="h3 fw-bold" th:text="${usuario.nombres+' '+usuario.apellidos}"></h1><p class="text-secondary" th:text="${'@'+usuario.nombreUsuario}"></p></div><span class="badge align-self-start" th:classappend="${usuario.idEstadoUsuario==1}?'text-bg-success':'text-bg-secondary'" th:text="${usuario.nombreEstado}"></span></div><dl class="row mb-0"><dt class="col-sm-4">Rol</dt><dd class="col-sm-8" th:text="${usuario.nombreRol}"></dd><dt class="col-sm-4">DNI</dt><dd class="col-sm-8" th:text="${#strings.isEmpty(usuario.nroDocumento)?'Sin DNI':usuario.nroDocumento}"></dd><dt class="col-sm-4">Telefono</dt><dd class="col-sm-8" th:text="${#strings.isEmpty(usuario.telefono)?'No registrado':usuario.telefono}"></dd><dt class="col-sm-4">Correo</dt><dd class="col-sm-8" th:text="${#strings.isEmpty(usuario.correo)?'No registrado':usuario.correo}"></dd></dl><a class="btn btn-outline-primary mt-3" th:href="@{'/interno/usuarios/'+${usuario.idUsuario}+'/editar'}">Editar perfil</a></section></div><div class="col-lg-5"><section class="card dentia-card border-0 p-4"><h2 class="h5 fw-bold">Restablecer contrasena</h2><p class="text-secondary">La clave nunca se muestra y se guardara con BCrypt.</p><form method="post" th:action="@{'/interno/usuarios/'+${usuario.idUsuario}+'/contrasena'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="password" class="form-control mb-3" name="nuevaContrasena" required autocomplete="new-password" placeholder="Nueva contrasena segura"><button class="btn btn-warning w-100">Restablecer contrasena</button></form></section></div></div></main><div th:replace="~{fragments/interno/footer :: footerInterno}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
