<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${titulo+' | DentIA'}"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/dentia/admin.css(v='20261109-2')}"></head><body><div th:replace="~{fragments/interno/header :: headerInterno}"></div><main class="dentia-page container-fluid admin-page"><a th:href="@{/interno/usuarios}" class="text-decoration-none text-success"><i class="bi bi-arrow-left"></i> Usuarios</a><h1 class="h2 fw-bold my-3" th:text="${titulo}"></h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form class="card dentia-card border-0 p-3 p-lg-4" method="post" enctype="multipart/form-data" th:object="${usuario}" th:action="@{/interno/usuarios/guardar}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{idUsuario}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombres *</label><input class="form-control" th:field="*{nombres}" required></div><div class="col-md-6"><label class="form-label">Apellidos *</label><input class="form-control" th:field="*{apellidos}" required></div><div class="col-md-4"><label class="form-label">DNI</label><input class="form-control" th:field="*{nroDocumento}" pattern="\d{8}"></div><div class="col-md-4"><label class="form-label">Telefono</label><input class="form-control" th:field="*{telefono}"></div><div class="col-md-4"><label class="form-label">Correo</label><input type="email" class="form-control" th:field="*{correo}"></div><div class="col-md-4"><label class="form-label">Nombre de usuario *</label><input class="form-control" th:field="*{nombreUsuario}" required></div><div class="col-md-4"><label class="form-label">Rol *</label><select class="form-select" th:field="*{idRol}" required><option value="">Seleccionar</option><option th:each="r:${roles}" th:value="${r.idRol}" th:text="${r.nombreRol}"></option></select></div><div class="col-md-4"><label class="form-label" th:text="${usuario.idUsuario==null?'Contrasena *':'Nueva contrasena'}"></label><input type="password" class="form-control" name="nuevaContrasena" th:required="${usuario.idUsuario==null}" autocomplete="new-password"><small class="text-secondary">Mayuscula, minuscula, numero y simbolo; minimo 8.</small></div><div class="col-12"><label class="form-label">Foto opcional</label><input type="file" class="form-control" name="fotoFile" accept="image/*"></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/interno/usuarios}">Cancelar</a><button class="btn btn-success">Guardar usuario</button></div></form></main><div th:replace="~{fragments/interno/footer :: footerInterno}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
