<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${titulo+' | DentIA'}"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/dentia/admin.css(v='20261109-2')}"></head><body><div th:replace="~{fragments/interno/header :: headerInterno}"></div><main class="dentia-page container-fluid admin-page"><a class="text-success text-decoration-none" th:href="@{/interno/pacientes}"><i class="bi bi-arrow-left"></i> Pacientes</a><h1 class="h2 fw-bold my-3" th:text="${titulo}"></h1><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form class="card dentia-card border-0 p-3 p-lg-4" method="post" th:action="@{/interno/pacientes}" th:object="${paciente}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{idPaciente}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombres *</label><input class="form-control" th:field="*{nombres}" required></div><div class="col-md-6"><label class="form-label">Apellidos *</label><input class="form-control" th:field="*{apellidos}" required></div><div class="col-md-4"><label class="form-label">DNI</label><input class="form-control" th:field="*{dni}" pattern="\d{8}"><small class="text-secondary">Puede dejarse vacio.</small></div><div class="col-md-4"><label class="form-label">Fecha de nacimiento *</label><input type="date" class="form-control" th:field="*{fechaNacimiento}" required></div><div class="col-md-4"><label class="form-label">Celular *</label><input class="form-control" th:field="*{celular}" required></div><div class="col-12"><label class="form-label">Correo</label><input type="email" class="form-control" th:field="*{correo}"></div></div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" th:href="@{/interno/pacientes}">Cancelar</a><button class="btn btn-success">Guardar paciente</button></div></form></main><div th:replace="~{fragments/interno/footer :: footerInterno}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
