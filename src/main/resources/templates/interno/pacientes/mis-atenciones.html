<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis atenciones | DentIA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head>
<body><div th:replace="~{fragments/interno/header :: headerInterno}"></div>
<main class="dentia-page container-fluid"><h1 class="h3">Mis atenciones</h1><p class="text-secondary">Tus últimas 200 atenciones. La ficha del paciente sigue compartida con el consultorio.</p>
<a class="btn btn-outline-success mb-3" th:href="@{/interno/pacientes}">Todos los pacientes</a>
<p th:if="${#lists.isEmpty(atenciones)}" class="alert alert-info">Todavía no hay atenciones vinculadas a tu cuenta. Revisa que tu usuario esté asociado al profesional en Administración → Profesionales.</p>
<article th:each="a:${atenciones}" class="card p-3 mb-2"><h2 class="h6" th:text="${a.paciente}"></h2><small class="text-secondary" th:text="${a.fecha}"></small><p class="my-2" th:text="${a.procedimiento}"></p><small th:text="${'Piezas: ' + (a.piezas ?: 'General')}"></small><a class="btn btn-sm btn-outline-success mt-2 align-self-start" th:href="@{/interno/clinica/atenciones(pacienteId=${a.pacienteId})}">Ver historial del paciente</a></article>
</main><div th:replace="~{fragments/interno/footer :: footerInterno}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
