<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DentIA | Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dentia/patient.css}">
</head>
<body class="dentia-patient py-5">
<main class="container">
    <div class="row justify-content-center">
        <div class="col-xl-8 col-lg-9">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <a th:href="@{/paciente/login}" class="dentia-brand fs-3 text-decoration-none"><span class="dentia-mark me-2"><i class="bi bi-heart-pulse-fill"></i></span>DentIA</a>
                <a th:href="@{/paciente/login}" class="btn btn-outline-secondary">Ya tengo cuenta</a>
            </div>
            <div class="card patient-card p-4 p-lg-5">
                <h1 class="h2 fw-bold">Crear cuenta de paciente</h1>
                <p class="text-secondary">Tus datos de paciente se mantienen separados de las cuentas del personal.</p>
                <div th:if="${errorRegistro}" class="alert alert-danger" th:text="${errorRegistro}"></div>
                <form th:action="@{/paciente/registro}" th:object="${registroPaciente}" method="post" novalidate>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Tipo de registro</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{tipoRegistro}" value="CON_DNI" id="conDni">
                                <label class="form-check-label" for="conDni">Tengo DNI</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{tipoRegistro}" value="SIN_DNI" id="sinDni">
                                <label class="form-check-label" for="sinDni">No tengo DNI</label>
                            </div>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6" id="dniGroup">
                            <label for="dni" class="form-label fw-semibold">DNI</label>
                            <input id="dni" th:field="*{dni}" inputmode="numeric" maxlength="8" class="form-control" placeholder="8 digitos">
                        </div>
                        <div class="col-md-6">
                            <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de nacimiento</label>
                            <input id="fechaNacimiento" th:field="*{fechaNacimiento}" type="date" class="form-control" required>
                            <div class="text-danger small" th:errors="*{fechaNacimiento}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="nombres" class="form-label fw-semibold">Nombres</label>
                            <input id="nombres" th:field="*{nombres}" class="form-control" autocomplete="given-name" required>
                            <div class="text-danger small" th:errors="*{nombres}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="apellidos" class="form-label fw-semibold">Apellidos</label>
                            <input id="apellidos" th:field="*{apellidos}" class="form-control" autocomplete="family-name" required>
                            <div class="text-danger small" th:errors="*{apellidos}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="celular" class="form-label fw-semibold">Celular</label>
                            <input id="celular" th:field="*{celular}" inputmode="tel" class="form-control" autocomplete="tel" required>
                            <div class="text-danger small" th:errors="*{celular}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="correo" class="form-label fw-semibold">Correo</label>
                            <input id="correo" th:field="*{correo}" type="email" class="form-control" autocomplete="email" required>
                            <div class="text-danger small" th:errors="*{correo}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Contrasena</label>
                            <input id="password" th:field="*{password}" type="password" class="form-control" autocomplete="new-password" required>
                            <div class="form-text">Minimo 8 caracteres.</div>
                            <div class="text-danger small" th:errors="*{password}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmarPassword" class="form-label fw-semibold">Confirmar contrasena</label>
                            <input id="confirmarPassword" th:field="*{confirmarPassword}" type="password" class="form-control" autocomplete="new-password" required>
                        </div>
                    </div>
                    <div class="alert alert-light border mt-4 small"><i class="bi bi-shield-check text-success me-2"></i>Crear una cuenta no genera una cita. La reserva siempre requerira iniciar sesion.</div>
                    <button class="btn btn-dentia btn-lg w-100 mt-2" type="submit">Crear mi cuenta</button>
                </form>
            </div>
        </div>
    </div>
</main>
<script>
    (() => {
        const radios = document.querySelectorAll('input[name="tipoRegistro"]');
        const group = document.getElementById('dniGroup');
        const dni = document.getElementById('dni');
        function syncDni() {
            const selected = document.querySelector('input[name="tipoRegistro"]:checked');
            const required = selected && selected.value === 'CON_DNI';
            group.classList.toggle('d-none', !required);
            dni.required = required;
            if (!required) dni.value = '';
        }
        radios.forEach(radio => radio.addEventListener('change', syncDni));
        syncDni();
    })();
</script>
</body>
</html>
