<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DentIA | Mis citas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/dentia/patient.css}"><link rel="stylesheet" th:href="@{/css/dentia/agenda.css}"></head>
<body class="dentia-patient"><nav class="navbar navbar-expand-lg patient-navbar border-bottom sticky-top"><div class="container"><a class="navbar-brand dentia-brand" th:href="@{/paciente}"><span class="dentia-mark me-2"><i class="bi bi-heart-pulse-fill"></i></span>DentIA</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#patientNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="patientNav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-2"><a class="nav-link" th:href="@{/paciente}">Inicio</a><a class="nav-link" th:href="@{/paciente/reservar-cita}">Reservar cita</a><a class="nav-link active" th:href="@{/paciente/mis-citas}">Mis citas</a><form th:action="@{/paciente/logout}" method="post"><button class="btn btn-outline-secondary">Salir</button></form></div></div></div></nav>
<main class="container py-4 py-lg-5"><div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><span class="agenda-kicker">Tu agenda</span><h1 class="h2 fw-bold mb-1">Mis citas</h1><p class="text-secondary mb-0">Consulta tus reservas reales y su estado.</p></div><a class="btn btn-dentia" th:href="@{/paciente/reservar-cita}"><i class="bi bi-calendar-plus me-2"></i>Nueva cita</a></div><div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
<section class="mb-5"><h2 class="h5 fw-bold mb-3">Proximas</h2><div class="row g-3" th:if="${!#lists.isEmpty(proximas)}"><div class="col-md-6 col-xl-4" th:each="c:${proximas}"><article class="patient-card bg-white p-4 h-100"><div class="d-flex justify-content-between gap-2"><span class="status-pill" th:text="${c.estado}"></span><strong class="text-success" th:text="${#temporals.format(c.inicio,'HH:mm')}"></strong></div><h3 class="h5 mt-3 mb-1" th:text="${#temporals.format(c.inicio,'EEEE dd MMMM yyyy')}"></h3><div class="text-secondary" th:text="${c.tipoAtencion}"></div><hr><div><i class="bi bi-person-vcard me-2 text-success"></i><span th:text="${c.profesional}"></span></div><small class="text-secondary" th:text="${c.especialidad}"></small></article></div></div><div class="empty-agenda" th:if="${#lists.isEmpty(proximas)}">No tienes citas proximas.</div></section>
<section class="mb-5"><h2 class="h5 fw-bold mb-3">Anteriores</h2><div class="appointment-list"><article class="appointment-row" th:each="c:${anteriores}"><div><strong th:text="${#temporals.format(c.inicio,'dd/MM/yyyy')}"></strong><div class="small" th:text="${#temporals.format(c.inicio,'HH:mm')}"></div></div><div><strong th:text="${c.tipoAtencion}"></strong><div class="small text-secondary" th:text="${c.profesional}"></div></div><div><span class="status-pill" th:text="${c.estado}"></span></div></article><div class="empty-agenda" th:if="${#lists.isEmpty(anteriores)}">Todavia no hay citas anteriores.</div></div></section>
<section><h2 class="h5 fw-bold mb-3">Canceladas</h2><div class="appointment-list"><article class="appointment-row" th:each="c:${canceladas}"><div><strong th:text="${#temporals.format(c.inicio,'dd/MM/yyyy')}"></strong><div class="small" th:text="${#temporals.format(c.inicio,'HH:mm')}"></div></div><div><strong th:text="${c.tipoAtencion}"></strong><div class="small text-secondary" th:text="${c.profesional}"></div></div><div><span class="status-pill" th:text="${c.estado}"></span></div></article><div class="empty-agenda" th:if="${#lists.isEmpty(canceladas)}">No tienes citas canceladas.</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
